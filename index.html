<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe | Classic</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="msg-container hide">
        <p id="msg">Winner</p>
        <button class="newbtn">New Game</button>
    </div>
    <main>
        <h1><span class="game-logo" aria-hidden="true"><span>X</span><span>O</span></span>Tic Tac Toe</h1>
        <div class="container">
            <div class="game">
                <button class="boxes"></button>
                <button class="boxes"></button>
                <button class="boxes"></button>
                <button class="boxes"></button>
                <button class="boxes"></button>
                <button class="boxes"></button>
                <button class="boxes"></button>
                <button class="boxes"></button>
                <button class="boxes"></button>
            </div>
        </div>
        <button class="reset">Reset Button</button>
    </main>
    <footer class="credit">Designed &amp; developed by <span>Viswajeet Vishwakarma</span></footer>
    <script src="app.js"></script>
    
</body>
</html>
