<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720" role="img" aria-labelledby="title description">
  <title id="title">Tic Tac Toe game preview</title>
  <desc id="description">A dark Tic Tac Toe game screen with a centered title, empty 3 by 3 board, red reset button, and creator credit.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#454545"/>
      <stop offset="1" stop-color="#30343b"/>
    </linearGradient>
    <linearGradient id="reset" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ef4444"/>
      <stop offset="1" stop-color="#b91c1c"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#000000" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="1100" height="720" rx="18" fill="url(#background)"/>
  <text x="550" y="100" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="58" font-weight="700" letter-spacing="1" text-anchor="middle">Tic Tac Toe</text>
  <g filter="url(#shadow)" fill="#ffffff">
    <rect x="352" y="145" width="122" height="122" rx="20"/>
    <rect x="489" y="145" width="122" height="122" rx="20"/>
    <rect x="626" y="145" width="122" height="122" rx="20"/>
    <rect x="352" y="282" width="122" height="122" rx="20"/>
    <rect x="489" y="282" width="122" height="122" rx="20"/>
    <rect x="626" y="282" width="122" height="122" rx="20"/>
    <rect x="352" y="419" width="122" height="122" rx="20"/>
    <rect x="489" y="419" width="122" height="122" rx="20"/>
    <rect x="626" y="419" width="122" height="122" rx="20"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="445" y="575" width="210" height="66" rx="16" fill="url(#reset)"/>
    <text x="550" y="617" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle">Reset Button</text>
  </g>
  <text x="550" y="688" fill="#b8bec8" font-family="Segoe UI, Arial, sans-serif" font-size="14" letter-spacing=".4" text-anchor="middle">Designed &amp; developed by <tspan fill="#f3f4f6" font-weight="600">Viswajeet Vishwakarma</tspan></text>
</svg>
